services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: dla-access-backend
    env: python
    rootDir: backend
    region: oregon
    buildCommand: "pip install -r pyproject.toml"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "DLA Access Enterprise"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dla-access-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dla-access-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "[\"https://dla-access-frontend.onrender.com\", \"http://localhost:3000\"]"

  # ----------------------------------------------------------------------------
  # Next.js Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: dla-access-frontend
    env: node
    rootDir: frontend
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dla-access-backend
          property: host

  # ----------------------------------------------------------------------------
  # Redis Cache
  # ----------------------------------------------------------------------------
  - type: redis
    name: dla-access-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: dla-access-db
    databaseName: dla_access_enterprise
    user: dla
    region: oregon
    plan: free
